<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#05020d"/>

  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(0,212,255,0.22)" stroke-width="0.8"/>

  <!-- Corner brackets TL -->
  <polyline points="5,10 5,5 10,5" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Corner brackets BR -->
  <polyline points="27,22 27,27 22,27" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Spine left -->
  <line x1="9" y1="7" x2="9" y2="25" stroke="#00d4ff" stroke-width="0.9" opacity="0.3"/>
  <!-- Spine right -->
  <line x1="23" y1="7" x2="23" y2="25" stroke="#7c3aed" stroke-width="0.9" opacity="0.3"/>

  <!-- DNA arc 1 (cyan) -->
  <path d="M 9 8 Q 16 13 23 8" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- DNA arc 2 (purple) -->
  <path d="M 9 14 Q 16 19 23 14" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- DNA arc 3 (cyan) -->
  <path d="M 9 20 Q 16 25 23 20" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Crossbar rungs -->
  <line x1="13" y1="10.2" x2="13" y2="12.2" stroke="rgba(0,212,255,0.35)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="16" y1="11" x2="16" y2="13" stroke="rgba(0,212,255,0.25)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="19" y1="10.2" x2="19" y2="12.2" stroke="rgba(0,212,255,0.35)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="13" y1="16.2" x2="13" y2="18.2" stroke="rgba(124,58,237,0.4)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="16" y1="17" x2="16" y2="19" stroke="rgba(124,58,237,0.3)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="19" y1="16.2" x2="19" y2="18.2" stroke="rgba(124,58,237,0.4)" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Cyan glow dot center -->
  <circle cx="16" cy="16" r="1.4" fill="#00d4ff" opacity="0.5"/>
</svg>
